# https://github.com/Koopex/uosc_history_menu

#================================[ Script Settings ]=================================

# Language
# <zh>: Chinese
# <en>: English
language=en

#-----------------------------[ Startup Action ]-----------------------------
# <resume>  Resume last played file
# <menu>    Open history menu on startup
# <none>    Do nothing
startup_action=none

#-------------------------[ Resume in Same Folder ]--------------------------
# When opening a file, if other videos in the same folder
# have playback history, prompt to jump to one of them.
# <yes>
# <no>
resume_in_folder=no

#----------------------------[ Restart Threshold ]----------------------------
# When opening from history, restart from the beginning
# if the played progress exceeds this percentage.
# Default 90
# <0>   Always restart from the beginning
# <100> Always resume progress
restart_threshold=90

#-----------------------------[ Title Source ]-------------------------------
# <yes>  Use filename
# <no>   Use media title
use_filename=no

#--------------------------[ Source Group View ]--------------------------
# How non-URL entries are built in the "By Source" view
# <yes> Keep only the newest record per folder
# <no>  Group by folder, showing every record in that folder
source_view_flat=no

#--------------------------[ Sort Search Results ]---------------------------
# <yes>  Sort by playback time
# <no>   Default order from uosc
search_sorting=no

#------------------------[ Bookmark New Group Button ]--------------------------
# <yes> Show a "New Group" button at the top of every level
# <no>  Don't show it
bookmark_new_group_button=no

#-------------------------[ Item Action Buttons ]-------------------------
# Action buttons for history entries (comma-separated, in display order;
# empty = no buttons, keyboard shortcuts still work)
# Available: mark (Bookmark), copy (Copy), delete (Delete)
history_actions=mark,delete
# Action buttons for bookmark entries (comma-separated, in display order;
# empty = no buttons, keyboard shortcuts still work)
# Available: new_group, rename, move, copy, cut, paste, delete
# Group syntax: [move,copy,cut] collapses the listed actions into a single
# "More actions" button; [] auto-fills actions not shown as buttons
# e.g. new_group,rename,delete,[move,copy,cut]
bookmark_actions=rename,delete,[]

#--------------------------[ History Entry Limit ]---------------------------
# Maximum number of history entries to keep (0 = unlimited; set a positive
# number to automatically trim the oldest excess entries)
max_entries=0

#------------------------------[ Data Path ]---------------------------------
# ~~/ refers to the mpv config directory
data_path=~~/uosc_history.json

#-----------------------------[ Bookmark File ]------------------------------
# Path to a separate bookmark storage file; leave empty to store bookmarks
# in the same file as history (data_path)
# e.g. ~~/_cache/uosc_bookmarks.json
bookmark_path=



#----------------------------------[ Shortcuts ]-------------------------------------
# r               script-binding uosc_history/history             #! Playback History
# Ctrl+r          script-binding uosc_history/enable_history      #! Toggle History
# Ctrl+Alt+r      script-binding uosc_history/clear_history       #! Clear History

# d               script-binding uosc_history/bookmarks           #! Bookmarks
# Ctrl+d          script-binding uosc_history/add_bookmarks       #! Add Bookmark
# Ctrl+D          script-binding uosc_history/add_playlist        #! Bookmark Playlist
# Alt+d           script-binding uosc_history/toggle_quick_mark   #! Toggle Quick Bookmark
# Ctrl+Alt+d      script-binding uosc_history/clear_bookmarks     #! Clear Bookmarks
#-----------------------------------------------------------------------------------

#--------------[ uosc Buttons ]--------------
# button:history          Playback History
# button:bookmarks        Bookmarks
# button:add_bookmarks    Add Bookmark
# button:add_playlist     Bookmark Playlist
