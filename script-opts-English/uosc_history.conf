##########---------uosc_history_menu Options---------##########
# https://github.com/Koopex/uosc_history_menu

############ Available Shortcuts ############ 	
# e				script-binding uosc_history/bookmarks	        #! Bookmarks							
# Ctrl+e		script-binding uosc_history/add_bookmarks		#! Add Bookmarks								
# Ctrl+Alt+e	script-binding uosc_history/clear_bookmarks		#! Clear Bookmarks	    				
# r				script-binding uosc_history/history	            #! Playback History                         
# Ctrl+r		script-binding uosc_history/enable_history      #! Enable/Disable History														
# Ctrl+Alt+r    script-binding uosc_history/clear_history	    #! Clear History

############ Available Buttons ############
# button:history             Playback History
# button:bookmarks           Bookmarks
# button:add_bookmarks       Add Bookmarks

# <en>: English
# <zh>: 中文
language=en

##### Startup Action #####
# <resume>: Play the last video.
# <menu>: Open history menu.
# <none>: None.
start_action=none

##### Notify the last played video in this folder #####
# <yes/no>
resume_in_folder=no

##### Log path #####
# /:dir%mpvconf%/ is the mpv config directory.
log_path=/:dir%mpvconf%/uosc_history.json

