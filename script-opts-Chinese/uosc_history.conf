# https://github.com/Koopex/uosc_history_menu

#================================[ 脚本设置 ]=================================

# 语言
# <zh>: 中文
# <en>: English
language=zh

#----------------------------[ 启动动作 ]-----------------------------
# <resume>  恢复播放上次文件
# <menu>    打开播放记录菜单
# <none>    无操作
startup_action=none

#--------------------------[ 同文件夹续播 ]---------------------------
# 打开文件时，若同文件夹内有其他视频的播放记录，弹窗提示是否跳转续播。
# <yes>
# <no>
resume_in_folder=no

#----------------------------[ 重播阈值 ]-----------------------------
# 从播放记录中打开时，若已播进度超过该百分比则从头播放。
# 默认90
# <0>   始终从头播放
# <100> 始终恢复进度
restart_threshold=90

#----------------------------[ 标题来源 ]-----------------------------
# <yes>  使用文件名
# <no>   使用媒体标题
use_filename=no

#--------------------------[ 按来源分组视图 ]--------------------------
# "按来源分组"视图中,非 URL 条目的构建方式
# <yes> 每个文件夹保留一条最新的记录
# <no> 按文件夹分组,组内包含该文件夹内所有记录
source_view_flat=no

#--------------------------[ 搜索结果排序 ]---------------------------
# <yes>  按播放时间排序
# <no>   uosc 默认顺序
search_sorting=no

#-----------------------[ 收藏夹新建分组按钮 ]-------------------------
# <yes> 每层收藏夹的顶部都会显示"新建分组"按钮
# <no> 不显示
bookmark_new_group_button=no

#----------------------------[ 条目操作按钮 ]-----------------------------
# 历史记录条目的操作按钮（逗号分隔，按显示顺序；留空 = 不显示按钮，快捷键仍可用）
# 可用值：mark（收藏）、copy（复制）、delete（删除）
history_actions=mark,delete
# 收藏条目的操作按钮
# 可用值：new_group（新建分组）、rename（重命名）、move（移动）、copy（复制）、cut（剪切）、paste（粘贴）、delete（删除）
# 分组语法：[move,copy,cut] 折叠为一个“更多操作”按钮，点击后展开该组操作；[] 等效于自动补充未显示的操作
# 例：new_group,rename,delete,[move,copy,cut]
bookmark_actions=rename,delete,[]

#--------------------------[ 历史记录上限 ]---------------------------
# 播放记录最多保存的条数（0 = 不限制；设置为正数后会自动裁掉最旧的超出记录）
max_entries=0

#----------------------------[ 数据路径 ]-----------------------------
# ~~/ 表示 mpv 配置目录
data_path=~~/uosc_history.json

#----------------------------[ 收藏文件 ]-----------------------------
# 收藏夹独立存储文件路径；留空则与历史记录存于同一文件（data_path）
# 例：~~/uosc_bookmarks.json
bookmark_path=



#------------------------------------[ 快捷键 ]------------------------------------
# r               script-binding uosc_history/history             #! 播放记录
# Ctrl+r          script-binding uosc_history/enable_history      #! 开关播放记录
# Ctrl+Alt+r      script-binding uosc_history/clear_history       #! 清空播放记录

# d               script-binding uosc_history/bookmarks           #! 收藏夹
# Ctrl+d          script-binding uosc_history/add_bookmarks       #! 添加收藏
# Ctrl+D          script-binding uosc_history/add_playlist        #! 收藏播放列表
# Alt+d           script-binding uosc_history/toggle_quick_mark   #! 切换 快速收藏模式
# Ctrl+Alt+d      script-binding uosc_history/clear_bookmarks     #! 清空收藏夹
#----------------------------------------------------------------------------------

#--------------[ uosc 按钮 ]--------------
# button:history          播放记录
# button:bookmarks        收藏夹
# button:add_bookmarks    添加收藏
# button:add_playlist     收藏播放列表
#----------------------------------------
